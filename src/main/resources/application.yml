# All environment-specific values are read from environment variables. No credentials or
# environment-specific endpoints are hardcoded here. See README.md for the full list.
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: user-management-service
  datasource:
    # DB_URL, when set, takes precedence over DB_HOST / DB_PORT / DB_NAME.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      # Schema management/migrations are out of scope for the scaffold (see README open gaps).
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: false

ums:
  info:
    environment: ${APP_ENVIRONMENT:unknown}
  db:
    validate-on-startup: ${DB_VALIDATE_ON_STARTUP:true}
    validation-timeout-seconds: ${DB_VALIDATION_TIMEOUT_SECONDS:2}
